name: Deploy to GitHub gh-pages branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-sites
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate site stats
      run: |
        updated=$(git log -1 --format=%cd --date=format:'%d/%m/%Y')
        commits=$(git rev-list --count HEAD)
        printf '{"updated":"%s","commits":%s}\n' "$updated" "$commits" > public/stats.json

    - name: Deploy to gh-pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public
        commit-message: Montezuma's github action that has a lot of rocket emojis
